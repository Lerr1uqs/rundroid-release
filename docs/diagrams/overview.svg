<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">rundroid 架构：Python 控制 Android ARM64 native 执行</title>
  <desc id="desc">Python 脚本配置 Java 与设备环境，并通过 PyO3 调用 Rust 运行时。Rust 负责 ELF 链接、Android kernel、ART/JNI 和 Unicorn ARM64，执行 APK 或 so 的 native 代码。运行时向 Python 回调，并返回调用结果、事件和调试信息。</desc>
  <defs>
    <style>
      .base{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .title{font-size:31px;font-weight:700;fill:#f8fafc}
      .subtitle{font-size:16px;fill:#aab9cc}
      .tag{font-size:13px;font-weight:700;letter-spacing:1px}
      .heading{font-size:22px;font-weight:700;fill:#f8fafc}
      .card-title{font-size:16px;font-weight:650;fill:#f0f7ff}
      .body{font-size:14px;fill:#aebfd2}
      .flow-label{font-size:14px;font-weight:650;fill:#a8e9f4}
      .output{font-size:16px;font-weight:600;fill:#eaf6ff}
    </style>
  </defs>

  <!-- 三栏顶部共用一条基线；留出完整的连接通道。 -->
  <rect width="1200" height="620" rx="22" fill="#0b1220"/>
  <text class="base title" x="40" y="55">Python 定义环境 · Rust 负责执行</text>
  <text class="base subtitle" x="41" y="86">在同一进程里装载、调用并分析 Android ARM64 native 代码</text>

  <!-- Python 控制层：脚本决定输入、环境和观察点。 -->
  <rect x="40" y="138" width="300" height="358" rx="16" fill="#142238" stroke="#4379a8" stroke-width="1.5"/>
  <text class="base tag" x="60" y="174" fill="#7dd3fc">01  PYTHON CONTROL</text>
  <text class="base heading" x="60" y="208">Python 脚本</text>
  <text class="base body" x="60" y="233">定义 guest 看见什么、在哪里停下</text>
  <rect x="60" y="257" width="260" height="62" rx="9" fill="#1c334c"/>
  <text class="base card-title" x="76" y="282">Java 与设备环境</text>
  <text class="base body" x="76" y="304">shim、属性、文件、虚拟设备</text>
  <rect x="60" y="330" width="260" height="62" rx="9" fill="#1c334c"/>
  <text class="base card-title" x="76" y="355">Hook 与断点</text>
  <text class="base body" x="76" y="377">Java、syscall、libc、内存</text>
  <rect x="60" y="403" width="260" height="62" rx="9" fill="#1c334c"/>
  <text class="base card-title" x="76" y="428">Trace 与现场调试</text>
  <text class="base body" x="76" y="450">寄存器、栈、符号、JNI 对象</text>

  <!-- PyO3 有两条独立路径，箭头直接绘制，避免缩放时 marker 叠成菱形。 -->
  <text class="base flow-label" x="380" y="269" text-anchor="middle">调用</text>
  <path d="M354 287 H399" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <path d="M410 287 L396 279 V295 Z" fill="#67e8f9"/>
  <text class="base flow-label" x="380" y="346" text-anchor="middle">回调</text>
  <path d="M407 364 H362" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <path d="M351 364 L365 356 V372 Z" fill="#67e8f9"/>
  <text class="base body mono" x="380" y="322" text-anchor="middle">PyO3</text>

  <!-- Rust 执行层：四个协同组件都处于同一运行时。 -->
  <rect x="420" y="138" width="480" height="358" rx="16" fill="#162836" stroke="#4c9a95" stroke-width="1.5"/>
  <text class="base tag" x="440" y="174" fill="#6ee7b7">02  RUST RUNTIME</text>
  <text class="base heading" x="440" y="208">Rust 执行核心</text>
  <text class="base body" x="440" y="233">固定 Android 13 / API 33 · ARM64 guest</text>
  <rect x="440" y="257" width="210" height="96" rx="9" fill="#1e3b44"/>
  <text class="base card-title" x="456" y="289">ELF loader + linker</text>
  <text class="base body" x="456" y="317">依赖、重定位、constructor</text>
  <rect x="670" y="257" width="210" height="96" rx="9" fill="#1e3b44"/>
  <text class="base card-title" x="686" y="289">Android kernel</text>
  <text class="base body" x="686" y="317">syscall、文件、线程、信号</text>
  <rect x="440" y="369" width="210" height="96" rx="9" fill="#1e3b44"/>
  <text class="base card-title" x="456" y="401">ART / JNI bridge</text>
  <text class="base body" x="456" y="429">Java 引用与 native 编组</text>
  <rect x="670" y="369" width="210" height="96" rx="9" fill="#1e3b44"/>
  <text class="base card-title" x="686" y="401">Unicorn ARM64</text>
  <text class="base body" x="686" y="429">CPU、内存、code hook</text>

  <!-- Guest 是 Rust 维护的目标地址空间，连接线居于两栏中线。 -->
  <text class="base flow-label" x="940" y="286" text-anchor="middle">执行</text>
  <path d="M914 314 H959" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <path d="M970 314 L956 306 V322 Z" fill="#67e8f9"/>
  <rect x="980" y="138" width="180" height="358" rx="16" fill="#25273d" stroke="#9b83b7" stroke-width="1.5"/>
  <text class="base tag" x="998" y="174" fill="#d8b4fe">03  GUEST</text>
  <text class="base heading" x="998" y="208">Native 目标</text>
  <text class="base body" x="998" y="233">Android ARM64 与依赖</text>
  <rect x="998" y="257" width="144" height="86" rx="9" fill="#36334b"/>
  <text class="base card-title" x="1014" y="289">目标库</text>
  <text class="base body mono" x="1014" y="315">APK / .so</text>
  <rect x="998" y="357" width="144" height="86" rx="9" fill="#36334b"/>
  <text class="base card-title" x="1014" y="389">系统依赖</text>
  <text class="base body mono" x="1014" y="415">/system/lib64</text>

  <!-- 结果从运行时向下返回；输出栏与三个主面板等宽对齐。 -->
  <path d="M660 500 V522" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <path d="M660 538 L652 524 H668 Z" fill="#67e8f9"/>
  <rect x="40" y="548" width="1120" height="58" rx="11" fill="#12354a" stroke="#287a94"/>
  <text class="base tag" x="60" y="582" fill="#67e8f9">OUTPUT</text>
  <text class="base output" x="172" y="583">native 返回值</text>
  <path d="M340 564 V590 M540 564 V590 M730 564 V590 M905 564 V590" stroke="#287a94" stroke-width="1.5"/>
  <text class="base output" x="366" y="583">GuestEvent</text>
  <text class="base output" x="566" y="583">指令 trace</text>
  <text class="base output" x="756" y="583">crashdump</text>
  <text class="base output" x="931" y="583">Python 后续分析</text>
</svg>
