<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">rundroid 架构：Python 定义环境，Rust 执行 Android ARM64 native</title>
  <desc id="desc">Python 脚本通过 PyO3 配置 Java shim、设备环境、拦截和调试。Rust 核心处理 ELF 链接、Android syscall、ART/JNI 与 Unicorn ARM64 执行，运行 APK 或独立 so 的 native 代码，并向 Python 返回结果、事件、trace 和 crashdump。</desc>
  <defs>
    <style>
      .base{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .hero{font-size:31px;font-weight:750;fill:#f8fafc}
      .subtitle{font-size:16px;fill:#aab9cc}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:1.2px}
      .heading{font-size:22px;font-weight:720;fill:#f8fafc}
      .body{font-size:15px;fill:#cfdbeb}
      .small{font-size:13px;fill:#9fb0c7}
      .chip{font-size:14px;font-weight:650;fill:#e7eef8}
      .output{font-size:16px;font-weight:650;fill:#eff6ff}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <!-- 顶部先说明两层分工，再展示组件。 -->
  <rect width="1200" height="630" rx="22" fill="#0b1220"/>
  <text class="base hero" x="38" y="57">Python 定义环境 · Rust 负责执行</text>
  <text class="base subtitle" x="39" y="87">同一进程内，把 Android native 调用变成可编排、可观察的脚本流程</text>

  <!-- Python 控制面：脚本决定 guest 看见什么、在哪里停下。 -->
  <rect x="38" y="126" width="300" height="382" rx="18" fill="#142238" stroke="#4379a8" stroke-width="1.5"/>
  <rect x="57" y="145" width="74" height="26" rx="13" fill="#153d59"/>
  <text class="base eyebrow" x="71" y="163" fill="#7dd3fc">CONTROL</text>
  <text class="base heading" x="58" y="206">Python 脚本</text>
  <text class="base small" x="58" y="230">输入、补环境、现场控制</text>
  <rect x="58" y="251" width="260" height="49" rx="9" fill="#1c334c"/>
  <text class="base chip" x="74" y="281">Java shim / method interceptor</text>
  <rect x="58" y="309" width="260" height="49" rx="9" fill="#1c334c"/>
  <text class="base chip" x="74" y="339">设备 Profile / 虚拟文件与设备</text>
  <rect x="58" y="367" width="260" height="49" rx="9" fill="#1c334c"/>
  <text class="base chip" x="74" y="397">断点 / watchpoint / syscall hook</text>
  <rect x="58" y="425" width="260" height="49" rx="9" fill="#1c334c"/>
  <text class="base chip" x="74" y="455">trace / 内存与 JNI inspection</text>

  <!-- PyO3 边界双向工作：Python 发起执行，Rust 命中时回调脚本。 -->
  <path d="M345 318 H378" stroke="#67e8f9" stroke-width="2.5" marker-start="url(#arrow-back)" marker-end="url(#arrow)"/>
  <text class="base small mono" x="345" y="296" fill="#67e8f9">PyO3</text>

  <!-- Rust 执行面：装载、系统语义、JNI 与 CPU 在核心层协同。 -->
  <rect x="384" y="126" width="508" height="382" rx="18" fill="#162836" stroke="#4c9a95" stroke-width="1.5"/>
  <rect x="404" y="145" width="81" height="26" rx="13" fill="#164940"/>
  <text class="base eyebrow" x="419" y="163" fill="#6ee7b7">RUNTIME</text>
  <text class="base heading" x="405" y="206">Rust 执行核心</text>
  <text class="base small" x="405" y="230">固定 Android 13 / API 33 · ARM64 guest</text>
  <rect x="405" y="252" width="223" height="96" rx="10" fill="#1e3b44"/>
  <text class="base chip" x="421" y="283">ELF loader + linker</text>
  <text class="base small" x="421" y="311">依赖、重定位、constructor</text>
  <rect x="647" y="252" width="223" height="96" rx="10" fill="#1e3b44"/>
  <text class="base chip" x="663" y="283">Android kernel</text>
  <text class="base small" x="663" y="311">syscall、文件、线程、信号</text>
  <rect x="405" y="362" width="223" height="96" rx="10" fill="#1e3b44"/>
  <text class="base chip" x="421" y="393">ART / JNI bridge</text>
  <text class="base small" x="421" y="421">Java 引用与 native 编组</text>
  <rect x="647" y="362" width="223" height="96" rx="10" fill="#1e3b44"/>
  <text class="base chip" x="663" y="393">Unicorn ARM64</text>
  <text class="base small" x="663" y="421">CPU、guest 内存与 code hook</text>

  <!-- Guest 是被仿真的目标地址空间，并非另起 Android 进程。 -->
  <path d="M899 318 H932" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="938" y="126" width="224" height="382" rx="18" fill="#25273d" stroke="#9b83b7" stroke-width="1.5"/>
  <rect x="958" y="145" width="62" height="26" rx="13" fill="#443454"/>
  <text class="base eyebrow" x="971" y="163" fill="#d8b4fe">GUEST</text>
  <text class="base heading" x="958" y="206">Android native</text>
  <text class="base small" x="958" y="230">被分析的目标与依赖</text>
  <rect x="958" y="252" width="184" height="58" rx="9" fill="#36334b"/>
  <text class="base chip mono" x="974" y="286">APK / libfoo.so</text>
  <rect x="958" y="320" width="184" height="58" rx="9" fill="#36334b"/>
  <text class="base chip mono" x="974" y="354">/system/lib64</text>
  <text class="base body" x="958" y="424">真实 ARM64 指令</text>
  <text class="base small" x="958" y="450">在受控 guest 中运行</text>

  <!-- 执行结果回到脚本，形成分析闭环。 -->
  <path d="M638 509 V537" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="38" y="546" width="1124" height="58" rx="12" fill="#12354a" stroke="#287a94"/>
  <text class="base eyebrow" x="59" y="581" fill="#67e8f9">OUTPUT</text>
  <text class="base output" x="151" y="582">native 返回值</text>
  <circle cx="333" cy="576" r="3" fill="#67e8f9"/>
  <text class="base output" x="350" y="582">GuestEvent</text>
  <circle cx="518" cy="576" r="3" fill="#67e8f9"/>
  <text class="base output" x="535" y="582">指令 trace</text>
  <circle cx="696" cy="576" r="3" fill="#67e8f9"/>
  <text class="base output" x="713" y="582">crashdump</text>
  <circle cx="875" cy="576" r="3" fill="#67e8f9"/>
  <text class="base output" x="892" y="582">Python 后续分析</text>
</svg>
